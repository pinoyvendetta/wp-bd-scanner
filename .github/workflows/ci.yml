name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python -m py_compile wpbdscanner.py

      - name: Regression tests
        run: python tests/test_scanner.py

      - name: Help / CLI smoke
        run: |
          python wpbdscanner.py --help
          mkdir -p /tmp/empty-wp
          python wpbdscanner.py -d /tmp/empty-wp -t 2 --json /tmp/out.json
          test -f /tmp/out.json
